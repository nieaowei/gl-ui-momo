name: Build and release APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-release.yml'
      - 'Makefile'
      - 'files/**'
      - 'scripts/build-apk.sh'
      - 'scripts/prepare-release.py'
      - 'scripts/test-release-version.py'
      - 'scripts/test-ui.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gl-ui-momo-release
  cancel-in-progress: false

jobs:
  build:
    name: Test and build APKv3
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      name: ${{ steps.version.outputs.name }}
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      upstream_tag: ${{ steps.version.outputs.upstream_tag }}
      upstream_commit: ${{ steps.version.outputs.upstream_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test release version resolution
        run: python3 scripts/test-release-version.py
      - name: Resolve upstream service version and project commit
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare-release.py
      - name: Test UI
        run: node scripts/test-ui.cjs
      - name: Build APK and SHA256 checksum
        run: sh scripts/build-apk.sh
      - name: Verify artifact and version
        shell: bash
        run: |
          set -euo pipefail
          name="$(awk -F':=' '$1=="PKG_NAME" {print $2; exit}' Makefile)"
          version="$(awk -F':=' '$1=="PKG_VERSION" {print $2; exit}' Makefile)"
          release="$(awk -F':=' '$1=="PKG_RELEASE" {print $2; exit}' Makefile)"
          file_version="$(printf '%s' "$version" | tr '~' '-')"
          file="dist/$name-$file_version-r$release.apk"
          test -s "$file"
          (cd dist && sha256sum -c "$name-$file_version-r$release.apk.sha256")
          echo "Verified package $file"
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-apk
          path: |
            dist/*.apk
            dist/*.apk.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish versioned GitHub Release
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: openwrt-apk
          path: dist
      - name: Release this package version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ needs.build.outputs.name }}
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
          PACKAGE_RELEASE: ${{ needs.build.outputs.release }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          UPSTREAM_TAG: ${{ needs.build.outputs.upstream_tag }}
          UPSTREAM_COMMIT: ${{ needs.build.outputs.upstream_commit }}
        run: |
          set -euo pipefail
          name="$PACKAGE_NAME"
          version="$PACKAGE_VERSION"
          release="$PACKAGE_RELEASE"
          tag="$RELEASE_TAG"
          file_version="$(printf '%s' "$version" | tr '~' '-')"
          file="dist/$name-$file_version-r$release.apk"
          checksum="$file.sha256"
          test -s "$file"
          (cd dist && sha256sum -c "$name-$file_version-r$release.apk.sha256")

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Keep the full commit check to reject short-hash collisions.
            existing_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')"
            if [ "$existing_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Release $tag already belongs to $existing_sha; refusing to overwrite it with $GITHUB_SHA."
              exit 1
            fi
            gh release upload "$tag" "$file" "$checksum" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$file" "$checksum" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$name $version-r$release" \
              --notes "OpenWrt APK v3 (noarch) built and checksum-verified from commit $GITHUB_SHA. Upstream Momo service: release $UPSTREAM_TAG, commit $UPSTREAM_COMMIT. This package is unsigned at origin; the central openwrt-packages repository re-signs it for the official feed."
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,assets \
            --jq '{url: .url, assets: [.assets[].name]}'
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.apk' --pattern '*.apk.sha256' --dir "$verify_dir"
          (cd "$verify_dir" && sha256sum -c ./*.apk.sha256)
